<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{background:transparent;margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}label{font-size:14px}select{font:inherit;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:6px;padding:6px}
.note{font-size:12px;color:var(--muted-foreground);margin:8px 0 14px;line-height:1.5}.row{display:grid;grid-template-columns:205px minmax(150px,1fr) 185px;align-items:center;gap:10px;padding:5px 0}.name{font-size:12px;line-height:1.35}.value{font-family:var(--font-mono,monospace);font-size:12px;text-align:right}.group{border-top:1px solid var(--border);margin-top:6px;padding-top:10px}svg{display:block;width:100%;height:28px;overflow:visible}.zero{stroke:var(--muted-foreground);stroke-dasharray:3 3;opacity:.4}.ci{stroke:var(--chart-1,#2884ad);stroke-width:2}.dot{fill:var(--chart-1,#2884ad)}.caption{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:12px}.scale{text-align:center;font-size:12px;color:var(--muted-foreground)}
@media(max-width:600px){.row{grid-template-columns:1fr 170px;gap:4px}.name{grid-column:1/-1}.value{font-size:11px}header{gap:6px}}
</style></head><body>
<header><label for="metric">Paired change</label><select id="metric"><option value="win_fraction">Win rate</option><option value="loss_fraction">Loss rate</option><option value="arrival_under4_fraction">Under-4 arrivals</option><option value="post_play_no_submission_27ticks_fraction">No submission after execution</option></select></header>
<div class="note" id="method"></div><div id="chart"></div><div class="scale" id="scale"></div><div class="caption">Dots are treatment − control, in percentage points; lines show pointwise percentile 95% bootstrap intervals. Behavior ratios pool event counts. Cadence-matched rows use the same enabled native rollout path; legacy rows also change the rollout cadence/path.</div>
<script>
const r=__RESULTS__;
const comparisons=[['opponent_delay_d0','Lag 22 vs legacy · own d=0'],['lag_only_d0','Lag 22 vs lag 0 · cadence 10, own d=0'],['opponent_delay_d27','Lag 22 vs legacy · own d=27'],['lag_only_d27','Lag 22 vs lag 0 · cadence 10, own d=27'],['latency_undelayed','Own d=27 vs 0 · legacy opponent'],['latency_undelayed_matched','Own d=27 vs 0 · lag 0, cadence 10'],['latency_delayed','Own d=27 vs 0 · opponent lag 22'],['two_outstanding','2 outstanding vs 1'],['four_outstanding','4 outstanding vs 1'],['four_vs_two_outstanding','4 outstanding vs 2'],['forward_imitation','Forward vs current imitation']];
const fmt=v=>(v>=0?'+':'')+(v*100).toFixed(2);
document.getElementById('method').textContent=`Non-confirmatory exploration · ${r.games.toLocaleString()} terminal games · ${r.paired_seeds.toLocaleString()} original pairs/arm · controls ${r.control_completion.status} · ${r.bootstrap.draws.toLocaleString()} paired resamples`;
function draw(){const metric=document.getElementById('metric').value;const available=comparisons.map(([key,label])=>({key,label,c:r.contrasts[key],m:r.contrasts[key].metrics[metric]}));const extent=Math.max(1,...available.flatMap(x=>x.m?x.m.ci95.map(v=>Math.abs(v*100)):[]))*1.12;const x=v=>200+v*100/extent*185;const chart=document.getElementById('chart');chart.innerHTML='';for(const [i,item]of available.entries()){const row=document.createElement('div');row.className='row'+([2,4,7,10].includes(i)?' group':'');const name=document.createElement('div');name.className='name';name.textContent=item.label;row.append(name);const graph=document.createElement('div');const value=document.createElement('div');value.className='value';if(item.m){const [lo,hi]=item.m.ci95;graph.innerHTML=`<svg viewBox="0 0 400 28" role="img" aria-label="${fmt(item.m.delta)} percentage points, interval ${fmt(lo)} to ${fmt(hi)}"><line class="zero" x1="200" y1="1" x2="200" y2="27"/><line class="ci" x1="${x(lo)}" y1="14" x2="${x(hi)}" y2="14"/><line class="ci" x1="${x(lo)}" y1="9" x2="${x(lo)}" y2="19"/><line class="ci" x1="${x(hi)}" y1="9" x2="${x(hi)}" y2="19"/><circle class="dot" cx="${x(item.m.delta)}" cy="14" r="4"/></svg>`;value.textContent=`${fmt(item.m.delta)} [${fmt(lo)}, ${fmt(hi)}]`;row.title=`${item.c.treatment} − ${item.c.control}; n=${item.c.paired_seeds} paired seeds`;}else{value.textContent='Unavailable';}row.append(graph,value);chart.append(row);}document.getElementById('scale').textContent=`← −${extent.toFixed(1)} pp     0     +${extent.toFixed(1)} pp →`;console.log('Rendered',available.filter(x=>x.m).length,'paired comparisons',metric);}
document.getElementById('metric').addEventListener('change',draw);draw();
</script></body></html>
