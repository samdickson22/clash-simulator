<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>clasher live · TV</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body.idle{cursor:none}
#stage{position:absolute;left:0;top:0;width:100vw;height:100vh;background:#000;overflow:hidden}
#stage video,#stage img,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#stage .back{visibility:hidden}
#snap[hidden]{display:none}
#stage canvas{pointer-events:none}
body.rot #stage{width:100vh;height:100vw;left:50%;top:50%;transform-origin:50% 50%}
body.rot90 #stage{transform:translate(-50%,-50%) rotate(90deg)}
body.rot270 #stage{transform:translate(-50%,-50%) rotate(-90deg)}
#bfs{position:fixed;right:14px;top:14px;z-index:5;font:600 16px -apple-system,sans-serif;padding:9px 14px;border:0;
 border-radius:8px;background:#1f6febcc;color:#fff;cursor:pointer;transition:opacity .4s}
body.idle #bfs{opacity:0;pointer-events:none}
</style></head>
<body class="idle">
<div id="stage">
 <video id="va" autoplay muted playsinline></video><video id="vb" class="back" autoplay muted playsinline></video>
 <img id="snap" hidden alt=""><canvas id="ov"></canvas>
</div>
<button id="bfs">Fullscreen</button>
<script src="/video/reader.js"></script>
<script src="/video/hls.min.js"></script>
<script src="/display/overlay.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
const vids = [$('va'), $('vb')]; let front = 0;
// ---------- layout: auto from the screen/window aspect; rotate=90|270 is a manual override ----------
const rot = ({'90': 90, '270': 270, '-90': 270})[q.get('rotate')] || 0;
function layout() {
  const b = document.body.classList;
  b.toggle('rot', !!rot); b.toggle('rot90', rot === 90); b.toggle('rot270', rot === 270);
}
addEventListener('resize', layout); layout();
// ---------- overlay toggle (default on; ?overlay=0/1 wins, else remembered) ----------
let ovOn = q.has('overlay') ? q.get('overlay') !== '0' : true;
ClasherOverlay.attach($('ov'), vids[0]);
ClasherOverlay.setVisible(ovOn);
addEventListener('keydown', e => { if (e.key === 'f') goFs(); });
// ---------- fullscreen + auto-hiding controls ----------
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function goFs() { const el = document.documentElement; const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) f.call(el).catch(() => {}); }
$('bfs').onclick = e => { e.stopPropagation(); fsOn() ? document.exitFullscreen() : goFs(); };
document.addEventListener('fullscreenchange', () => { $('bfs').textContent = fsOn() ? 'Exit fullscreen' : 'Fullscreen'; });
let idle = null;
function wake() { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 3000); }
addEventListener('mousemove', wake); addEventListener('touchstart', wake); wake();
// ---------- video: WebRTC (native 'desktop' rendition) into the BACK element, swap when it plays ----------
const rendition = q.get('r') || 'desktop';
let reader = null, hls = null, gen = 0, connecting = false, lastT = -1, lastMove = performance.now(), mode = '', hlsTimer = null;
function vstat(s) {}
function swapTo(back, my) {
  if (my !== gen || back === vids[front]) return;
  clearTimeout(hlsTimer);
  back.classList.remove('back'); const old = vids[front]; old.classList.add('back'); front = vids.indexOf(back);
  setTimeout(() => { if (old !== vids[front]) { old.pause(); old.srcObject = null; old.removeAttribute('src'); old.load(); } }, 400);
  lastT = -1; lastMove = performance.now(); connecting = false;
}
function connect() {
  connecting = true;
  const my = ++gen, back = vids[1 - front];
  clearTimeout(hlsTimer);
  back.onplaying = null; back.pause(); back.srcObject = null; back.removeAttribute('src'); back.load();   // clean reuse
  back.onplaying = () => swapTo(back, my);
  const oldReader = reader, oldHls = hls; reader = null; hls = null;
  const closeOld = () => { if (oldReader) oldReader.close(); if (oldHls) oldHls.destroy(); };
  if (q.get('t') !== 'hls' && window.isSecureContext && window.RTCPeerConnection && window.MediaMTXWebRTCReader) {
    mode = 'WebRTC'; vstat('connecting WebRTC · ' + rendition);
    // HLS fallback unless the back element actually PLAYS within 6 s (a track alone is not enough)
    hlsTimer = setTimeout(() => { if (my === gen && connecting) { closeOld(); if (reader) { reader.close(); reader = null; }
                                  back.srcObject = null; hlsInto(back, my); } }, 6000);
    reader = new MediaMTXWebRTCReader({url: new URL('/video/webrtc/' + rendition + '/whep', location.href).href,
      onTrack: e => { if (my !== gen) return; back.srcObject = e.streams[0]; back.play().catch(() => {});
                      vstat('WebRTC · ' + rendition); setTimeout(closeOld, 1500); },
      onError: () => {}});
  } else { closeOld(); hlsInto(back, my); }
}
function hlsInto(v, my) {
  mode = 'LL-HLS'; vstat('LL-HLS · ' + rendition);
  const url = '/video/hls/' + rendition + '/index.m3u8';
  if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = url; v.play().catch(() => {}); return; }
  if (!(window.Hls && Hls.isSupported())) return;
  hls = new Hls({lowLatencyMode: true, backBufferLength: 2, liveSyncDuration: 0.6, liveMaxLatencyDuration: 2, maxLiveSyncPlaybackRate: 1.15});
  hls.loadSource(url); hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
  hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal && my === gen) connecting = false; });
}
// watchdog: the front video must keep advancing; reconnect in the background (front keeps its last frame)
setInterval(() => {
  const v = vids[front];
  if (v.currentTime !== lastT && !v.paused) { lastT = v.currentTime; lastMove = performance.now(); snapshots(false); return; }
  const stuck = performance.now() - lastMove;
  if (stuck > 3000) snapshots(true);
  if ((!connecting && stuck > 1500) || (connecting && stuck > 9000)) { lastMove = performance.now() - 1000; connect(); }
}, 500);
// fallback while the HD video is down: the driver page's JPEG snapshots (same game picture, lower resolution)
let snapOn = false, snapURL = null, snapGen = 0;
function snapshots(on) {
  if (on === snapOn) return; snapOn = on; $('snap').hidden = !on;
  const my = ++snapGen;
  if (on) (async function loop() {
    while (snapOn && my === snapGen) {
      try { const r = await fetch('/frame.jpg?_=' + Date.now(), {cache: 'no-store'});
            if (r.ok && my === snapGen) { const bl = await r.blob(); if (my !== snapGen) break; const u = URL.createObjectURL(bl); $('snap').src = u; if (snapURL) URL.revokeObjectURL(snapURL); snapURL = u; } } catch (e) {}
      await new Promise(r => setTimeout(r, 200));
    }
  })();
}
connect();
</script></body></html>
