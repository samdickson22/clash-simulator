[package]
name = "clasher-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "_clasher_rust"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
